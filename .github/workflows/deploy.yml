name: 🚀 Deploy to Namecheap via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath
          coverage: none

      - name: 📦 Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist

      - name: 🧪 Prepare environment & run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: 📦 Install production Composer dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      - name: 🚀 Deploy via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avz --delete --exclude=".env" --exclude=".git" --exclude="node_modules" --exclude="storage/**" --exclude="bootstrap/cache/**"
          path: ./
          remote_path: ${{ secrets.APP_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: ⚙️ Run Laravel commands on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.APP_PATH }}

            echo "Working directory: $(pwd)"

            echo "Listing current path contents:"
            ls -la

            echo "Migration status before migrate:"
            php artisan migrate:status --database=mysql || true

            php artisan migrate --force --database=mysql

            php artisan db:seed \
              --force \
              --class=DatabaseSeeder \
              --database=mysql

            echo "Migration status after migrate:"
            php artisan migrate:status --database=mysql || true

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
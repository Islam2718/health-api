name: 🚀 Deploy to Namecheap via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout Repository
      # =========================================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup PHP
      # =========================================================
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath
          coverage: none
          tools: composer


      # =========================================================
      # 3. Install Composer Dependencies
      # =========================================================
      - name: 📦 Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist


      # =========================================================
      # 4. Prepare Test Environment
      # =========================================================
      - name: 🧪 Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate


      # =========================================================
      # 5. Run Tests
      # =========================================================
      - name: 🧪 Run tests
        run: |
          php artisan test


      # =========================================================
      # 6. Install Production Dependencies
      # =========================================================
      # Tests need dev dependencies.
      # Production server only needs production dependencies.
      #
      # IMPORTANT:
      # This happens on GitHub Actions, NOT on Namecheap.
      # So Namecheap does not need to download packages from GitHub.
      # =========================================================
      - name: 📦 Install production Composer dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader


      # =========================================================
      # 7. Test SSH Connection
      # =========================================================
      - name: 🔌 Test SSH connection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          timeout: 60s
          command_timeout: 1m

          script: |
            echo "=========================================="
            echo "SSH connection successful"
            echo "=========================================="

            echo "Server:"
            hostname

            echo "User:"
            whoami

            echo "Current directory:"
            pwd

            echo "PHP version:"
            php -v | head -n 1

            echo "Composer version:"
            composer --version


      # =========================================================
      # 8. Deploy Files to Namecheap
      # =========================================================
      - name: 🚀 Deploy via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: >-
            -avz
            --delete
            --exclude=".env"
            --exclude=".git"
            --exclude="node_modules"
            --exclude="storage/**"
            --exclude="bootstrap/cache/**"

          path: ./

          remote_path: ${{ secrets.APP_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}


      # =========================================================
      # 9. Run Laravel Commands on Namecheap
      # =========================================================
      - name: ⚙️ Run Laravel commands on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          # SSH connection timeout
          timeout: 60s

          # Laravel commands can take longer
          command_timeout: 10m

          script: |

            # ---------------------------------------------------
            # Go to Laravel project directory
            # ---------------------------------------------------
            cd ${{ secrets.APP_PATH }}

            echo "=========================================="
            echo "Working directory"
            echo "=========================================="

            pwd


            # ---------------------------------------------------
            # Check files
            # ---------------------------------------------------
            echo "=========================================="
            echo "Project files"
            echo "=========================================="

            ls -la


            # ---------------------------------------------------
            # Check PHP
            # ---------------------------------------------------
            echo "=========================================="
            echo "PHP version"
            echo "=========================================="

            php -v


            # ---------------------------------------------------
            # Check Laravel
            # ---------------------------------------------------
            echo "=========================================="
            echo "Laravel version"
            echo "=========================================="

            php artisan --version


            # ---------------------------------------------------
            # Check migration status
            # ---------------------------------------------------
            echo "=========================================="
            echo "Migration status BEFORE migrate"
            echo "=========================================="

            php artisan migrate:status \
              --database=mysql || true


            # ---------------------------------------------------
            # Run migrations
            # ---------------------------------------------------
            echo "=========================================="
            echo "Running migrations"
            echo "=========================================="

            php artisan migrate \
              --force \
              --database=mysql


            # ---------------------------------------------------
            # Run database seeder
            # ---------------------------------------------------
            echo "=========================================="
            echo "Running DatabaseSeeder"
            echo "=========================================="

            php artisan db:seed \
              --force \
              --class=DatabaseSeeder \
              --database=mysql


            # ---------------------------------------------------
            # Check migration status again
            # ---------------------------------------------------
            echo "=========================================="
            echo "Migration status AFTER migrate"
            echo "=========================================="

            php artisan migrate:status \
              --database=mysql || true


            # ---------------------------------------------------
            # Clear all Laravel caches
            # ---------------------------------------------------
            echo "=========================================="
            echo "Clearing Laravel caches"
            echo "=========================================="

            php artisan optimize:clear


            # ---------------------------------------------------
            # Cache configuration
            # ---------------------------------------------------
            echo "=========================================="
            echo "Caching configuration"
            echo "=========================================="

            php artisan config:cache


            # ---------------------------------------------------
            # Cache routes
            # ---------------------------------------------------
            echo "=========================================="
            echo "Caching routes"
            echo "=========================================="

            php artisan route:cache


            # ---------------------------------------------------
            # Cache views
            # ---------------------------------------------------
            echo "=========================================="
            echo "Caching views"
            echo "=========================================="

            php artisan view:cache


            # ---------------------------------------------------
            # Deployment complete
            # ---------------------------------------------------
            echo "=========================================="
            echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=========================================="
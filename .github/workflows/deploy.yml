name: 🚀 Deploy to Namecheap via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, mysql
          coverage: none

      - name: 📦 Install Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist

      - name: 🧪 Prepare environment & run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: 🚀 Deploy via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avz --delete --exclude=".env" --exclude=".git" --exclude="node_modules" --exclude="storage/**" --exclude="bootstrap/cache/**"
          path: ./
          remote_path: ${{ secrets.APP_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: ⚙️ Run Laravel commands on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Debug info
            echo "Current user: $(whoami)"
            echo "Current directory: $(pwd)"
            
            cd ${{ secrets.APP_PATH }} || {
              echo "Failed to change to APP_PATH: ${{ secrets.APP_PATH }}"
              exit 1
            }
            
            echo "Working directory: $(pwd)"
            echo "Listing current path contents:"
            ls -la
            
            # Check if .env exists, if not copy from .env.example
            if [ ! -f .env ]; then
              echo ".env file not found, copying from .env.example"
              cp .env.example .env
            fi
            
            # Install dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Test database connection
            echo "Testing database connection..."
            php artisan migrate:status --database=mysql || {
              echo "❌ Database connection failed!"
              echo "Check your .env database settings"
              exit 1
            }
            
            # Run migrations
            echo "Running migrations..."
            php artisan migrate --force --database=mysql
            
            # Run seeders
            echo "Running seeders..."
            php artisan db:seed --force --class=DatabaseSeeder --database=mysql
            
            # Clear and cache
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "✅ Deployment completed successfully!"